schema_version: 1
name: qwen3-8b-tenant-fairness
measurement_tool: inferscale-native-http-v1
publishable: false
target:
  base_url: https://api.inferscale.example
  deployment: qwen-chat
  deployment_id_env: INFERSCALE_DEPLOYMENT_ID
  api_key_env: INFERSCALE_API_KEY
  request_timeout_s: 300
deployment:
  model: Qwen/Qwen3-8B
  model_revision: b968826d9c46dd6066d109eabc6255188de91218
  backend: vllm
  backend_version: 0.23.0
  precision: bf16
  quantization: none
  gpu_type: RTX_5090
  gpu_count: 1
  tensor_parallelism: 1
  prefix_cache: true
  max_model_len: 8192
workload:
  input_tokens: 512
  output_tokens: 128
  concurrency: 32
  requests: 800
  dataset: ../workloads/smoke.jsonl
  seed: 17
cache_state: process-warm
routing: {policy: load-aware}
experiment:
  secondary_api_key_env: INFERSCALE_SECONDARY_API_KEY
  secondary_deployment_id_env: INFERSCALE_SECONDARY_DEPLOYMENT_ID
  noisy_tenant_concurrency: 64
  verify_secondary_progress: true
metadata: {provider: set-at-run-time}
