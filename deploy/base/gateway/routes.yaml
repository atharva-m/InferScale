apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferscale-control-api
  namespace: inferscale-gateway
spec:
  parentRefs:
    - {name: inferscale, sectionName: http}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/deployments}
        - path: {type: PathPrefix, value: /v1/operations}
      backendRefs:
        - name: inferscale-api
          namespace: inferscale-system
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferscale-health
  namespace: inferscale-gateway
spec:
  parentRefs:
    - {name: inferscale, sectionName: http}
  rules:
    - matches:
        - path: {type: Exact, value: /healthz}
      backendRefs:
        - name: inferscale-api
          namespace: inferscale-system
          port: 8080
