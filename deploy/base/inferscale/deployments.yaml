            - {name: http, containerPort: 8082}
            - {name: grpc, containerPort: 9001}
            - {name: metrics, containerPort: 9090}
          envFrom:
            - configMapRef: {name: inferscale-config}
          env:
            - name: INFERSCALE_HTTP_ADDR
              value: :8082
            - name: INFERSCALE_GRPC_ADDR
              value: :9001
            - name: INFERSCALE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: inferscale-storage, key: database_url}}
            - name: INFERSCALE_VALKEY_ADDR
              valueFrom: {secretKeyRef: {name: inferscale-storage, key: valkey_addr, optional: true}}
            - name: INFERSCALE_VALKEY_URL
              valueFrom: {secretKeyRef: {name: inferscale-storage, key: valkey_url, optional: true}}
            - name: INFERSCALE_BENCHMARK_CALLBACK_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: inferscale-storage, key: benchmark_callback_signing_key}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
