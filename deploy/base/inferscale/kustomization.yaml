apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inferscale-system
resources:
  - crd/platform.inferscale.io_inferencedeployments.yaml
  - namespace.yaml
  - serviceaccounts.yaml
  - rbac.yaml
  - generated/role.yaml
  - migrations.yaml
  - deployments.yaml
  - services.yaml
  - reference-grant.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: inferscale
configMapGenerator:
  - name: inferscale-config
    literals:
      - INFERSCALE_ENV=development
      - INFERSCALE_LOG_LEVEL=info
      - INFERSCALE_METRICS_ADDR=:9090
      - INFERSCALE_PROMETHEUS_URL=http://prometheus.inferscale-monitoring.svc.cluster.local:9090
      - INFERSCALE_USAGE_AGGREGATION_INTERVAL=5m
      - INFERSCALE_USAGE_LOOKBACK_HOURS=2
      - INFERSCALE_OTLP_ENDPOINT=http://otel-collector.inferscale-monitoring.svc.cluster.local:4317
      - INFERSCALE_CONTROL_NAMESPACE=inferscale-system
      - INFERSCALE_GATEWAY_NAME=inferscale
      - INFERSCALE_GATEWAY_NAMESPACE=inferscale-gateway
      - INFERSCALE_PUBLIC_BASE_URL=http://127.0.0.1:8080
      - INFERSCALE_MODEL_CACHE_ROOT=/var/lib/inferscale/models
      - INFERSCALE_ENGINE_CACHE_ROOT=/var/lib/inferscale/engines
      - INFERSCALE_VLLM_VERSION=0.23.0
      - INFERSCALE_TRTLLM_VERSION=1.0.0
      - INFERSCALE_EPP_IMAGE=ghcr.io/llm-d/llm-d-router-endpoint-picker@sha256:873179822ab0895a37ea09f2112ca39a6ae50a26612561c8bfad7f9a8c5af6f5
      - INFERSCALE_FEATURE_SCALE_TO_ZERO=false
      - INFERSCALE_FEATURE_PROGRESSIVE_ROLLOUT=false
      - INFERSCALE_FEATURE_TRTLLM=false
      - INFERSCALE_FEATURE_BACKEND_AUTO=false
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: migration-gate-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: inferscale-(api|controller|admission)
images:
  - name: ghcr.io/inferscale/api
    newTag: 0.1.0-dev
  - name: ghcr.io/inferscale/controller
    newTag: 0.1.0-dev
  - name: ghcr.io/inferscale/admission
    newTag: 0.1.0-dev
  - name: ghcr.io/inferscale/migrate
    newTag: 0.1.0-dev
