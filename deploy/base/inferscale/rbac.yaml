apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inferscale-api
rules:
  - apiGroups: ["platform.inferscale.io"]
    resources: ["inferencedeployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.inferscale.io"]
    resources: ["inferencedeployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inferscale-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inferscale-api
subjects:
  - kind: ServiceAccount
    name: inferscale-api
    namespace: inferscale-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inferscale-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inferscale-controller
subjects:
  - kind: ServiceAccount
    name: inferscale-controller
    namespace: inferscale-system
