apiVersion: v1
kind: Service
metadata:
  name: inferscale-api
spec:
  selector: {app.kubernetes.io/name: inferscale-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: inferscale-admission
spec:
  selector: {app.kubernetes.io/name: inferscale-admission}
  ports:
    - {name: http, port: 8082, targetPort: http}
    - {name: grpc, port: 9001, targetPort: grpc, appProtocol: kubernetes.io/h2c}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: inferscale-controller-metrics
spec:
  selector: {app.kubernetes.io/name: inferscale-controller}
  ports:
    - {name: metrics, port: 9090, targetPort: metrics}
