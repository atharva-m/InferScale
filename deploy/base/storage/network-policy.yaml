apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-to-storage
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, valkey]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [inferscale-api, inferscale-controller, inferscale-admission, inferscale-migrate]}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
