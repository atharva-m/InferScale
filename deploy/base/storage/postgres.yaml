apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: inferscale-storage, key: postgres_user}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: inferscale-storage, key: postgres_password}}}
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: inferscale-storage, key: postgres_database}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {exec: {command: [pg_isready, -U, inferscale]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -U, inferscale]}, initialDelaySeconds: 10, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
