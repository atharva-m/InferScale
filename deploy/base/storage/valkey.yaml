apiVersion: v1
kind: Service
metadata: {name: valkey}
spec:
  selector: {app.kubernetes.io/name: valkey}
  ports: [{name: valkey, port: 6379, targetPort: valkey}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: valkey}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: valkey}}
  template:
    metadata: {labels: {app.kubernetes.io/name: valkey}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: valkey/valkey@sha256:752ba000a58bc8925d11ee863a39b5225617cd2cb3dbc9ec8ac65268b65ebb6d
          args: [valkey-server, --save, "", --appendonly, "no"]
          ports: [{name: valkey, containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: [sh, -c, 'valkey-cli ping | grep -q PONG']}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
