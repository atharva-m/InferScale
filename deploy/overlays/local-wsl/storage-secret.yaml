apiVersion: v1
kind: Secret
metadata:
  name: inferscale-storage
  namespace: inferscale-system
  annotations:
    inferscale.io/local-development-only: "true"
type: Opaque
stringData:
  postgres_user: inferscale
  postgres_password: local-development-only
  postgres_database: inferscale
  database_url: postgres://inferscale:local-development-only@postgres.inferscale-system.svc.cluster.local:5432/inferscale?sslmode=disable
  valkey_addr: valkey.inferscale-system.svc.cluster.local:6379
  benchmark_callback_signing_key: local-benchmark-callback-key-change-me-0123456789
  benchmark_runner_image: ghcr.io/inferscale/benchmark:0.1.0-dev
  runtime_vllm_image: ghcr.io/inferscale/fake-runtime:0.1.0-dev
  runtime_trtllm_image: ghcr.io/inferscale/trtllm:0.1.0-dev
  modelcache_image: ghcr.io/inferscale/modelcache:0.1.0-dev
