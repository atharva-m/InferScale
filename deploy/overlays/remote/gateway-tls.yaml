apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inferscale
  namespace: inferscale-gateway
spec:
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - {group: "", kind: Secret, name: inferscale-tls}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              inferscale.io/gateway-routes: allowed
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferscale-control-api
  namespace: inferscale-gateway
spec:
  parentRefs:
    - {name: inferscale, sectionName: https}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inferscale-health
  namespace: inferscale-gateway
spec:
  parentRefs:
    - {name: inferscale, sectionName: https}
