apiVersion: v1
kind: Namespace
metadata:
  name: TENANT_NAMESPACE
  labels:
    app.kubernetes.io/managed-by: inferscale-controller
    inferscale.io/gateway-routes: allowed
    inferscale.io/tenant: TENANT_SLUG
    # v1 uses a node-local hostPath cache. Pod Security restricted/baseline
    # reject hostPath volumes, so admission is privileged at namespace scope;
    # every rendered container is still explicitly hardened and the runtime
    # mounts only its immutable cache entry read-only.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inferscale-runtime
  namespace: TENANT_NAMESPACE
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: inferscale-tenant-quota
  namespace: TENANT_NAMESPACE
  annotations:
    inferscale.io/steady-state-gpu-quota: "GPU_QUOTA"
spec:
  hard:
    pods: "50"
    services: "20"
    requests.cpu: "64"
    requests.memory: 256Gi
    limits.cpu: "128"
    limits.memory: 512Gi
    requests.nvidia.com/gpu: "GPU_RESOURCE_QUOTA"
    limits.nvidia.com/gpu: "GPU_RESOURCE_QUOTA"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: inferscale-container-bounds
  namespace: TENANT_NAMESPACE
spec:
  limits:
    - type: Container
      min: {cpu: 10m, memory: 16Mi}
      max: {cpu: "128", memory: 512Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: TENANT_NAMESPACE
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-paths
  namespace: TENANT_NAMESPACE
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: inferscale-gateway}}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 9002}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: inferscale-monitoring}}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 9090}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: inferscale-monitoring}}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-benchmark-callback-egress
  namespace: TENANT_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inferscale-benchmark
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: inferscale-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: inferscale-api}}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector: {matchLabels: {inferscale.io/access-role: gateway}}
    - to:
        - namespaceSelector: {matchLabels: {inferscale.io/access-role: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports:
        - {protocol: TCP, port: 9090}
