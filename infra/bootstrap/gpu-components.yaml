apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
  labels:
    app.kubernetes.io/part-of: inferscale
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: inferscale-gpu-system
  labels:
    app.kubernetes.io/part-of: inferscale
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dcgm-metrics-ingress
  namespace: inferscale-gpu-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inferscale-monitoring
      ports:
        - protocol: TCP
          port: 9400
