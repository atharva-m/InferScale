[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inferscale-modelcache"
version = "0.1.0"
description = "Immutable node-local model cache prefetch utility"
requires-python = ">=3.10"
dependencies = ["huggingface-hub==0.33.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.setuptools]
packages = ["modelcache"]
package-dir = {modelcache = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
