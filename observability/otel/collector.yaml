receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
  resource:
    attributes:
      - {key: service.namespace, value: inferscale, action: insert}
  batch:
    timeout: 5s
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    tls: {insecure: true}
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion: {enabled: true}
  debug:
    verbosity: basic
service:
  telemetry:
    logs: {level: info}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
